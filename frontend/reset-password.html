<!DOCTYPE html>
<html>
<head>
  <title>Reset Password</title>
  <link rel="stylesheet" href="common.css" />
</head>
<body>
<div id="navbar"></div>

<script>
  fetch("navbar.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("navbar").innerHTML = html;
    });
</script>

<div class="auth-container">
  <div class="auth-card">
    <h2>Set New Password</h2>
    <p class="auth-subtitle">Use temporary password from email to set a new one</p>

    <label>Email</label>
    <input id="resetEmail" type="email" placeholder="you@example.com" />

    <label>Temporary Password</label>
    <input id="tempPassword" type="password" placeholder="Enter temporary password" />

    <label>New Password</label>
    <input id="newPassword" type="password" placeholder="Enter new password" />

    <label>Confirm New Password</label>
    <input id="confirmPassword" type="password" placeholder="Confirm new password" />

    <button id="resetBtn" onclick="submitPasswordReset()">Set New Password</button>

    <p id="resetMsg" class="error-text" style="display:none;"></p>

    <p class="auth-footer">
      Back to <a href="login.html">Login</a>
    </p>
  </div>
</div>

<script src="reset-password.js"></script>
</body>
</html>
