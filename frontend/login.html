<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
<link rel="stylesheet" href="common.css" />
</head>
<body>
<div id="navbar"></div>

<script>
  fetch("navbar.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("navbar").innerHTML = html;
      // renderNavbar();
    });
</script>
<div class="auth-container">
  <div class="auth-card">

    <div id="loginHeader">
      <h2>Welcome</h2>
      <p class="auth-subtitle">Login to continue ordering your favorite food</p>
    </div>

    <div class="auth-form" id="loginFields">

      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com">

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••">

      <button id="loginBtn" onclick="login()">Login</button>

      <p class="forgot-link">
        <a href="#" onclick="toggleForgotPassword(event)">Forgot password?</a>
      </p>

    </div>


    <div id="forgotPasswordBox" class="auth-form" style="display:none;">

      <p class="auth-subtitle">Enter your registered email</p>
      
      <input id="forgotEmail" type="email" placeholder="you@example.com">
      <hr>
      <button id="forgotBtn" onclick="forgotPassword()">
        Send Temporary Password
      </button>

      <p id="forgotMsg" class="error-text" style="display:none;"></p>

      <p class="forgot-link">
        <a href="#" onclick="showLoginFields(event)">Back to login</a>
      </p>

    </div>

    <p id="loginError" class="error-text" style="display:none;"></p>

    <p class="auth-footer">
      New user?
      <a href="register.html">Register here</a>
    </p>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
