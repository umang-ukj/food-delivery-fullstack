<!DOCTYPE html>
<html>

<head>
  <title>My Orders</title>
  <link rel="stylesheet" href="common.css" />

</head>

<body>

  <div id="navbar"></div>

  <script>
    fetch("navbar.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("navbar").innerHTML = html;
        renderNavbar();
      });
  </script>
  <script src="navbar.js"></script>

  <div class="page-container">

    <h2 class="page-title">My Orders</h2>
    <p style="margin-top:-4px;color:#555;">Use <b>Reorder
      </b> to refill your cart from a previous order and checkout again.</p>
    <div id="ordersPagination" class="orders-pagination"></div>
    <!-- Orders list -->
    <ul id="orders" class="orders-list"></ul>
  <section class="complaints-section">
      <h3 class="section-subtitle">My Complaints</h3>
      <div id="myComplaints" class="complaints-list"></div>
    </section>
  </div>
  <div id="complaintModal" class="modal-overlay complaint-modal-overlay" style="display:none;" onclick="closeComplaintDialog()">
    <div class="modal-card complaint-modal-card" onclick="event.stopPropagation()">
      <h3>Raise Complaint</h3>
      <input type="hidden" id="complaintOrderId" />
      <label for="complaintSubject">Subject</label>
      <input id="complaintSubject" class="admin-input" maxlength="120" placeholder="Late delivery" />
      <label for="complaintDescription">Description</label>
      <textarea id="complaintDescription" class="admin-input complaint-response-input" maxlength="1500" placeholder="Please describe your issue in detail."></textarea>
      <div class="complaint-actions-row">
        <button class="admin-mini-btn" onclick="submitComplaintForm()">Submit</button>
        <button class="admin-mini-btn admin-danger-btn" onclick="closeComplaintDialog()">Cancel</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    loadOrders();
    loadMyComplaints();
  </script>

</body>

</html>
