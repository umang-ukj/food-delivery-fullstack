<!DOCTYPE html>
<html>
<head>
  <title>Food Delivery</title>
  <link rel="stylesheet" href="common.css" />
</head>
<body>
<div class="landing-page">
  <header class="landing-header">
    <div class="landing-brand">Food Delivery</div>
    <button class="landing-login-btn"
     onclick="window.location.href='login.html'">Sign in</button>
  </header>

  <section class="landing-hero">
    <h1>Order food from your favorite restaurants</h1>
    <div class="landing-search-row">
      <input
        id="landingLocationInput"
        type="text"
        placeholder="Enter your delivery location"
        onkeydown="if (event.key === 'Enter') searchLandingByLocation()"
      />
      <button class="primary-btn" onclick="searchLandingByLocation()">Find food</button>
    </div>
  </section>
</div>
    <div id="landingResults" class="page-container" style="display:none;">
  <h2 class="page-title">Restaurants in <span id="landingLocationTag"></span></h2>
  <div id="landingRestaurants" class="restaurant-grid"></div>
</div>

  <div id="serviceabilityModal" class="modal-overlay" style="display:none;" onclick="closeServiceabilityPopup()">
  <div class="modal-card" onclick="event.stopPropagation()">
    <h3>Service availability</h3>
    <p id="serviceabilityMessage"></p>
    <button class="primary-btn" onclick="closeServiceabilityPopup()">Okay</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
